# Деплой мини-приложения (frontend) на GitHub Pages.
# Настройки репозитория (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE_URL — публичный HTTPS-адрес бэкенда, например https://api.example.ru/api/v1
#                       (если не задан, приложение работает на встроенных демо-данных);
#   PAGES_BASE        — базовый путь сайта; по умолчанию /<имя репозитория>/,
#                       для своего домена (CNAME) укажите /.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -- --base="${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
